name: CommercePilot AI Service Tests

# Additive-only CI workflow (handover gap #6). Runs the Python test suite for
# commerce-pilot-ai on push/PR. Requires no secrets and does not touch any
# deployed service. Committed locally as part of the project handover; a
# maintainer must push it to a remote with GitHub Actions enabled for it to
# actually run -- this file alone does not grant remote CI without that step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-pilot-ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run test suite
        run: python -m pytest tests/ -q
