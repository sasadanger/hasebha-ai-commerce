  - {experiment_id: EXPERIMENT_G_customer_service_ecommerce_politeness_intent, authorization_status: BLOCKED, dataset_id: adab_politeness, task: POLITENESS, research_only: true, commercial_use_authorized: false, reason: Gated access and data-rights verification unresolved, blocking_requirements: [GATED_ACCESS, DATA_RIGHTS, QUALITY_AUDIT], training_executed: false}
