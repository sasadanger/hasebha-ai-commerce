- feature_name: product_category_diversity
  classification: UNVERIFIED_ASOF
  primary_asof: false
  decision_timestamp: order_approved_at
  source: olist_products_dataset (joined via items)
  source_timestamp: none (no timestamp/version column in source table)
  aggregation_rule: count(distinct product_category_name) GROUP BY order_id, via items JOIN products USING(product_id)
  latest_safe_cutoff: unknown (static catalog export, no versioning)
  leakage_rule: none present in source code (src/modeling/olist/expanded_feature_builder.py); no temporal
    predicate on payments or items/products joins
  availability_evidence: WEAK_INFERRED
  evidence_strength: WEAK_INFERRED
  notes: olist_products_dataset schema is exactly [product_id, product_category_name, product_name_lenght,
    product_description_lenght, product_photos_qty, product_weight_g, product_length_cm, product_height_cm,
    product_width_cm] -- independently confirmed by direct parquet schema inspection this session. There
    is no timestamp or version field of any kind. This is a single static current-day catalog export joined
    by product_id with no snapshot/versioning mechanism (docs/olist_asof_feature_contract.md already flags
    this CONDITIONALLY_ALLOWED pending 'approval-time catalog snapshot' verification; the code confirms
    no such snapshot mechanism exists). A product's recorded category or physical dimensions could have
    been corrected by a seller/catalog admin after any given historical order was placed, and the feature
    would silently reflect the corrected/current value with no way to detect this from the data as exported.
