decision_timestamp: order_approved_at
target: late_delivery = order_delivered_customer_date > order_estimated_delivery_date
features:
- feature_name: payment_record_count
  classification: UNVERIFIED_ASOF
  primary_asof: false
  decision_timestamp: order_approved_at
  source: olist_order_payments_dataset
  source_timestamp: none (no timestamp column in source table)
  aggregation_rule: count(*) GROUP BY order_id
  latest_safe_cutoff: unknown (no source timestamp exists)
  leakage_rule: none present in source code (src/modeling/olist/expanded_feature_builder.py); no temporal
    predicate on payments or items/products joins
  availability_evidence: WEAK_INFERRED
  evidence_strength: WEAK_INFERRED
  notes: 'olist_order_payments_dataset schema is exactly [order_id, payment_sequential, payment_type,
    payment_installments, payment_value] -- independently confirmed by direct parquet schema inspection
    this session. No event timestamp of any kind exists in this table. The build_development() SQL (expanded_feature_builder.py)
    aggregates ALL payment rows for the order_id with no temporal predicate, because none is possible.
    order_approved_at is documented as ''confirmed payment approval'', which plausibly implies all payment_sequential
    rows for an order are registered together at authorization even when payment_installments>1 (a typical
    Brazilian installment-card pattern where the total is authorized upfront and charged over future months).
    This is a plausible domain inference, not a proven fact: the repository contains no evidence ruling
    out payment records being appended, corrected, or only fully known after order_approved_at.'
