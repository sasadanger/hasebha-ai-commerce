- feature_name: item_count
  classification: UNVERIFIED_ASOF
  primary_asof: false
  decision_timestamp: order_approved_at
  source: olist_order_items_dataset
  source_timestamp: implicitly order_purchase_timestamp (no direct per-item timestamp)
  aggregation_rule: count(*) GROUP BY order_id
  latest_safe_cutoff: order_approved_at (unverified, inferred only)
  leakage_rule: none present in source code (src/modeling/olist/expanded_feature_builder.py); no temporal
    predicate on payments or items/products joins
  availability_evidence: STRONG_INFERRED
  evidence_strength: STRONG_INFERRED
  notes: 'olist_order_items_dataset rows are tied 1:1 to the specific order being scored (grouped by order_id
    before use, per docs/olist_join_aggregation_contract.md), not aggregated across other orders, so this
    is not a cross-order historical-aggregation leakage pattern (Step 7 audit: not applicable to this
    feature). build_development() enforces order_approved_at>=order_purchase_timestamp for every eligible
    row, and items are the composition of what was purchased, so item-level facts (which product, which
    seller, price, freight) plausibly existed no later than order_purchase_timestamp, which by construction
    precedes order_approved_at. However, no per-item creation or modification timestamp exists in the
    source schema to directly prove items/prices were immutable between purchase and approval (e.g. that
    no item could be added, removed, or re-priced during that interval).'
